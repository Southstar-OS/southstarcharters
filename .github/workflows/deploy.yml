name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    name: Deploy Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify Vercel secrets are configured
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ]      && missing+=(VERCEL_TOKEN)
          [ -z "$VERCEL_ORG_ID" ]     && missing+=(VERCEL_ORG_ID)
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=(VERCEL_PROJECT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "::error::See docs/vercel-deploy-runbook.md for setup instructions."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        run: |
          npm install -g vercel
          if ! vercel whoami 2>&1; then
            echo "::error::Vercel authentication failed. VERCEL_TOKEN may be expired or invalid."
            echo "::error::See docs/vercel-deploy-runbook.md for instructions to refresh credentials."
            exit 1
          fi
          vercel pull --yes --environment=preview
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build project
        run: pnpm build
        env:
          # Dummy values so the build does not fail in CI
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXT_PUBLIC_SITE_URL: "https://southstarchartersnj.com"

      - name: Deploy to Vercel (Preview)
        run: vercel deploy --prebuilt
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify Vercel secrets are configured
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ]      && missing+=(VERCEL_TOKEN)
          [ -z "$VERCEL_ORG_ID" ]     && missing+=(VERCEL_ORG_ID)
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=(VERCEL_PROJECT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "::error::See docs/vercel-deploy-runbook.md for setup instructions."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        run: |
          npm install -g vercel
          if ! vercel whoami 2>&1; then
            echo "::error::Vercel authentication failed. VERCEL_TOKEN may be expired or invalid."
            echo "::error::See docs/vercel-deploy-runbook.md for instructions to refresh credentials."
            exit 1
          fi
          vercel pull --yes --environment=production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build project
        run: pnpm build
        env:
          # Dummy values so the build does not fail in CI
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXT_PUBLIC_SITE_URL: "https://southstarchartersnj.com"

      - name: Deploy to Vercel (Production)
        run: vercel deploy --prebuilt --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
