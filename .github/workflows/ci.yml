name: CI — Lint, Typecheck & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Reject npm lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "::error::package-lock.json is committed; this repo uses pnpm only."; exit 1
          fi

      - name: Reject token-based Vercel deploy
        run: |
          # Deploys go through Vercel's Git integration — no GitHub Actions deploy,
          # no Vercel auth token. A token-based deploy workflow was added/removed
          # repeatedly and always broke when the token expired; block it for good.
          # Patterns match the actual secret reference and vercel CLI commands (and
          # use bracket tricks so this guard never matches its own source line).
          if grep -rEl 'secrets\.VERCEL_[T]OKEN|vercel[[:space:]]+(deploy|pull|build)' .github/workflows/; then
            echo "::error::Token-based Vercel deploy detected in a workflow."
            echo "::error::This repo deploys via Vercel's Git integration only. Remove the deploy workflow; see DEPLOYMENT.md."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: "https://southstarchartersnj.com"
