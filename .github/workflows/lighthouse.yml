name: Lighthouse Audit

on:
  # Vercel's Git integration deploys on push; audit the live site on a schedule.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Audit production site
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://southstarchartersnj.com/
            https://southstarchartersnj.com/harbor-tours
            https://southstarchartersnj.com/fishing-charters
            https://southstarchartersnj.com/contact
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          # Bypass SSL interstitial so Lighthouse can reach the site during CI.
          # This mirrors the `curl -k` flag already used in security-headers.yml.
          # Track SSL certificate status separately via the security-headers workflow.
          chromeFlags: "--ignore-certificate-errors"

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30
